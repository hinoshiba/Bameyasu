<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f4ec">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/assets/app-icon.png">
    <link rel="stylesheet" href="/styles.css">
    <title>ページが見つかりません — Bameyasu</title>
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center; }
      .not-found img { width: 88px; margin: 0 auto 28px; border-radius: 22px; box-shadow: var(--shadow); }
      .not-found small { color: var(--ember-dark); font-weight: 900; letter-spacing: .16em; }
      .not-found h1 { margin: 12px 0; font-size: clamp(2.5rem, 8vw, 5rem); }
      .not-found p { color: var(--muted); }
      .not-found .button { margin-top: 14px; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <img src="/assets/app-icon.png" width="88" height="88" alt="Bameyasu">
        <small>404</small>
        <h1>この場所は、まだ測れません。</h1>
        <p>お探しのページは移動したか、存在しないようです。</p>
        <a class="button primary" href="/">トップへ戻る</a>
      </div>
    </main>
  </body>
</html>
