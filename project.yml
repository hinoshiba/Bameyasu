name: Bameyasu
options:
  bundleIdPrefix: com.hinoshiba
  developmentLanguage: ja
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "94HVVWXLK3"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

targets:
  Bameyasu:
    type: application
    platform: iOS
    sources:
      - path: Bameyasu
        excludes:
          - Resources/Info.plist
      - path: LICENSE
        buildPhase: resources
      - path: PRIVACY.md
        buildPhase: resources
      - path: TERMS.md
        buildPhase: resources
      - path: METHODOLOGY.md
        buildPhase: resources
      - path: SOURCES.md
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.txt
        buildPhase: resources
    info:
      path: Bameyasu/Resources/Info.plist
      properties:
        CFBundleDisplayName: Bameyasu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - ja
          - en
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: 机上の明るさと明暗差をカメラ入力からリアルタイム解析します。画像や映像は保存・送信されません。
        NSMicrophoneUsageDescription: 周囲の音量を端末上でリアルタイム解析します。音声は保存・送信されません。
        NSMotionUsageDescription: 机の揺れと傾きを測定するためにモーションセンサーを使用します。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.bameyasu
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - BameyasuTests

  BameyasuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BameyasuTests
    dependencies:
      - target: Bameyasu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.bameyasu.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Bameyasu.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Bameyasu
        BUNDLE_LOADER: $(TEST_HOST)
