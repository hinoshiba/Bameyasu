name: Bug report / 不具合報告
description: Report a reproducible Bameyasu problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private camera/audio content. Report vulnerabilities privately to support@hinoshiba.com and review SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: iPhone, iOS, and Bameyasu version
    validations:
      required: true
  - type: dropdown
    id: permission
    attributes:
      label: Relevant permission state
      options: [Allowed, Denied, Not asked, Not relevant, Unknown]
    validations:
      required: true
